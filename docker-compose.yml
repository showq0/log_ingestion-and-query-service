services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    environment:
      HOST: "db"
      PLATFORM: linux/arm64
      PORT: 8080
      DB_URL: postgres://postgres:postgres@host.docker.internal:5432/logs_db?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logs_db
      DB_URL: postgres://postgres:postgres@host.docker.internal:5432/logs_db?sslmode=disable

    ports:
      - "5432:5432"
    command: [
      "postgres",
      "-c", "shared_preload_libraries=timescaledb",
      "-c", "max_connections=100",
      "-c", "shared_buffers=256MB",      # Allocates dedicated RAM for caching (25% of 1G limit)
      "-c", "work_mem=4MB",             # Speeds up sorting/aggregations without CPU thrashing
      "-c", "maintenance_work_mem=64MB", # Speeds up hypertable chunk creation and indexing
      "-c", "synchronous_commit=off",     # Dramatically cuts write latency & CPU waiting time
      "-c", "gin_pending_list_limit=4MB"   # Controls how large the GIN insert buffer can grow before flushing
    ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d logs_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
