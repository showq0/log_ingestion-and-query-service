services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HOST: db
      PLATFORM: linux/arm64
      PORT: 8080
      CLICKHOUSE_URL: http://db:8123
      CLICKHOUSE_DB: logs_db
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  db:
    image: clickhouse/clickhouse-server:24.8
  
    environment:
      CLICKHOUSE_DB: logs_db
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
  
    ports:
      - "8123:8123"
      - "9000:9000"
  
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
  
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
  
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  